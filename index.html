<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Todavía no sé tu flor</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#000;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 100%,#3a0b05 0%,#120404 45%,#000 85%);cursor:pointer;user-select:none;-webkit-user-select:none}
#field{position:fixed;inset:0;overflow:hidden}
.fl{position:absolute;transform:translateX(-50%)}
.fl svg{width:100%;height:100%;overflow:visible;transform-origin:50% 100%;animation:sway var(--sd) ease-in-out var(--sl) infinite alternate}
@keyframes sway{from{transform:rotate(calc(var(--a)*-1))}to{transform:rotate(var(--a))}}
#petals{position:fixed;inset:0;z-index:12;pointer-events:none;overflow:hidden}
.p{position:absolute;top:0;animation:fall linear infinite}
.p i{display:block;width:100%;height:100%;background:linear-gradient(135deg,#ff6a2c,#b3140a);border-radius:100% 0 100% 0;filter:drop-shadow(0 0 4px rgba(255,60,20,.55));animation:flutter 2.4s ease-in-out infinite alternate}
@keyframes fall{0%{transform:translate(0,-8vh) rotate(0);opacity:0}10%{opacity:.95}90%{opacity:.9}100%{transform:translate(var(--dx),108vh) rotate(var(--r));opacity:0}}
@keyframes flutter{from{transform:translateX(-14px) perspective(300px) rotate3d(1,.4,0,0deg)}to{transform:translateX(14px) perspective(300px) rotate3d(1,.4,0,75deg)}}
.t{position:absolute;top:8%;left:0;right:0;z-index:30;text-align:center;padding:0 6vw;pointer-events:none;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:300;color:#ffe6da;font-size:clamp(1.5rem,4.6vw,2.7rem);line-height:1.35;text-shadow:0 0 18px rgba(255,60,20,.55),0 2px 12px #000}
.t span{display:block;opacity:0;transform:translateY(12px);animation:in 2.4s ease-out forwards}
.t .s{margin-top:.8em;font-size:.72em;color:#ffc9b5}
@keyframes in{to{opacity:1;transform:none}}
#fx{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.sp{position:absolute;margin:-3px 0 0 -3px;filter:drop-shadow(0 0 3px currentColor) drop-shadow(0 0 7px currentColor);animation:spark 1s ease-out forwards}
.sp i{display:block;width:100%;height:100%;background:currentColor;border-radius:50%}
.sp i.star{border-radius:0;transform:scale(1.9);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
@keyframes spark{0%{transform:translate(0,0) scale(.3);opacity:1}30%{opacity:1;transform:translate(calc(var(--dx)*.6),calc(var(--dy)*.6)) scale(1.1)}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.fl2{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,40,20,.25) 40%,transparent 70%);animation:flash .6s ease-out forwards}
@keyframes flash{from{transform:scale(.2);opacity:1}to{transform:scale(1.5);opacity:0}}
#ctl{position:fixed;top:12px;right:12px;z-index:50;display:flex;gap:8px;align-items:center;font-family:'Cormorant Garamond',Georgia,serif}
#ctl .song,#pp{font:inherit;font-size:1rem;color:#ffd8cc;background:rgba(0,0,0,.45);border:1px solid rgba(255,120,90,.5);border-radius:20px;padding:7px 14px;cursor:pointer;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ctl .song:hover,#pp:hover{background:rgba(120,20,10,.5)}
.song input{display:none}
</style>
</head>
<body>
<div id="field"></div>
<div id="petals"></div>
<div class="t">
  <span style="animation-delay:.8s">Todavía no sé tu flor.</span>
  <span style="animation-delay:2.8s">Todavía no sé tu canción.</span>
  <span class="s" style="animation-delay:5.2s">Pero ya sé que hay cosas que quiero aprender de vos.</span>
</div>
<div id="fx"></div>
<div id="ctl">
  <label class="song"><input type="file" id="file" accept="audio/*"><span id="lbl">♪ Agregar canción</span></label>
  <button id="pp" hidden>❚❚</button>
</div>
<audio id="aud" loop></audio>
<script>
// Para dejar la canción fija, pon aquí su ruta o data URI.
var SONG_SRC = "Malcolm Todd - 4me 4me (sub español).mp3";

function R(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var PAL=['#ff3b14','#ff5a1f','#e22a0c','#ff7a2e','#c91d08'];
function head(r){
  var o='',i,a,s,col,f,L,ex,ey;
  for(i=0;i<9;i++){
    a=(-84+i*21+(r()-.5)*14)*Math.PI/180;L=105+r()*55;
    ex=Math.sin(a)*L;ey=-Math.cos(a)*L*.85-10;
    o+='<path d="M0 0Q'+(Math.sin(a)*L*.2+(r()-.5)*30).toFixed(1)+' '+(-L*.75).toFixed(1)+' '+ex.toFixed(1)+' '+ey.toFixed(1)+'" fill="none" stroke="#ff6a2c" stroke-width="1.6" stroke-linecap="round"/><circle cx="'+ex.toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="2.6" fill="#ffb36b"/>';
  }
  for(i=0;i<6;i++){
    a=-105+i*42+(r()-.5)*20;s=.8+r()*.45;col=PAL[(r()*PAL.length)|0];f=r()<.5?-1:1;
    o+='<path transform="rotate('+a.toFixed(0)+') scale('+(s*f).toFixed(2)+','+s.toFixed(2)+')" d="M0 0C-10 -18 -24 -42 -10 -68C-4 -80 12 -84 24 -70C8 -66 8 -38 3 -16Z" fill="'+col+'" stroke="rgba(255,190,120,.45)" stroke-width="1"/>';
  }
  return o+'<path d="M0 2C-14 12 -18 30 -10 46C-6 30 -2 14 0 2Z" fill="#2c1409"/><circle r="5" fill="#2a0f08"/>';
}
var field=document.getElementById('field');
function flower(x,hv,H,bot,z,dim){
  var r=R((x*100+hv*7)|0),b=(r()-.5)*24,st=H-190,t=(r()-.5)*36,sc=.85+r()*.3;
  var d=document.createElement('div');d.className='fl';
  d.style.cssText='left:'+x.toFixed(1)+'%;height:'+hv.toFixed(1)+'vh;width:'+(hv*320/H).toFixed(2)+'vh;bottom:'+bot.toFixed(1)+'vh;z-index:'+z+(dim<1?';filter:brightness('+dim.toFixed(2)+')':'');
  d.innerHTML='<svg viewBox="-160 -190 320 '+H+'" style="--a:'+(1+r()*1.4).toFixed(2)+'deg;--sd:'+(5+r()*4).toFixed(1)+'s;--sl:-'+(r()*8).toFixed(1)+'s"><path d="M0 0C'+b.toFixed(1)+' '+(st*.3).toFixed(0)+' '+(-b).toFixed(1)+' '+(st*.7).toFixed(0)+' '+(b*.5).toFixed(1)+' '+st+'" fill="none" stroke="#150605" stroke-width="7" stroke-linecap="round"/><g transform="rotate('+t.toFixed(0)+') scale('+sc.toFixed(2)+')">'+head(r)+'</g></svg>';
  field.appendChild(d);
}
var rnd=R(7),i;
for(i=0;i<18;i++){var hv=30+rnd()*16;flower(i*(104/17)-2+(rnd()-.5)*4,hv,Math.round(hv/.09),-3+rnd()*5,1+(i%3),.75+rnd()*.25)}
[[10,64],[31,76],[52,68],[72,80],[91,60]].forEach(function(p,k){flower(p[0]+(rnd()-.5)*3,p[1],Math.round(p[1]/.1),-3,6+k,1)});

var pf=document.getElementById('petals');
for(i=0;i<28;i++){
  var p=document.createElement('div'),w=9+Math.random()*13;
  p.className='p';
  p.style.cssText='left:'+Math.random()*105+'vw;width:'+w+'px;height:'+w*.62+'px;--dx:'+(-35+Math.random()*30)+'vw;--r:'+(240+Math.random()*420)+'deg;animation-duration:'+(10+Math.random()*10)+'s;animation-delay:-'+Math.random()*18+'s';
  p.innerHTML='<i></i>';pf.appendChild(p);
}

var fx=document.getElementById('fx');
function burst(x,y){
  var fl=document.createElement('div');fl.className='fl2';fl.style.left=x+'px';fl.style.top=y+'px';fx.appendChild(fl);
  setTimeout(function(){fl.remove()},700);
  for(var k=0;k<16;k++){
    var sp=document.createElement('span'),a=Math.random()*6.283,d=30+Math.random()*80,sz=4+Math.random()*7;
    sp.className='sp';
    sp.style.cssText='left:'+x+'px;top:'+y+'px;width:'+sz+'px;height:'+sz+'px;color:'+(Math.random()<.5?'#fff':'#ff2a1a')+';--dx:'+(Math.cos(a)*d).toFixed(1)+'px;--dy:'+(Math.sin(a)*d+20).toFixed(1)+'px;animation-duration:'+(.7+Math.random()*.7).toFixed(2)+'s';
    var q=document.createElement('i');if(Math.random()<.55)q.className='star';
    sp.appendChild(q);fx.appendChild(sp);
    (function(e){setTimeout(function(){e.remove()},1500)})(sp);
  }
}
document.addEventListener('pointerdown',function(e){burst(e.clientX,e.clientY)});

var aud=document.getElementById('aud'),file=document.getElementById('file'),lbl=document.getElementById('lbl'),pp=document.getElementById('pp');
if(SONG_SRC){
  aud.src=SONG_SRC;
  lbl.parentNode.style.display='none';
  pp.hidden=false;

  // Intenta iniciar la canción al aparecer el texto. Si el navegador bloquea
  // la reproducción automática, se iniciará en el primer toque o clic.
  aud.play().then(function(){
    pp.textContent='❚❚';
  }).catch(function(){
    function iniciarCancion(){
      aud.play().then(function(){pp.textContent='❚❚'}).catch(function(){});
    }
    document.addEventListener('pointerdown',iniciarCancion,{once:true});
  });
}
file.addEventListener('change',function(){
  if(file.files[0]){
    aud.src=URL.createObjectURL(file.files[0]);
    lbl.textContent='♪ '+file.files[0].name;
    pp.hidden=false;pp.textContent='❚❚';
    aud.play().catch(function(){pp.textContent='▶'});
  }
});
pp.addEventListener('click',function(){
  if(aud.paused){aud.play();pp.textContent='❚❚'}else{aud.pause();pp.textContent='▶'}
});
</script>
</body>
</html>
